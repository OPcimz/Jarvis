<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300d4ff'/></svg>">
<style>
  :root {
    --bg:#050b10; --panel:#0a1620; --line:#12303f; --pri:#00d4ff; --text:#d8f3ff; --dim:#6f95a6;
    --me:#06323f; --him:#0b1d29; --ok:#2fe38a; --warn:#ffb020;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); }
  .brand { font-weight:700; letter-spacing:.18em; color:var(--pri); }
  .status { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.off { background:var(--warn); }
  #log { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word;
    border:1px solid var(--line); unicode-bidi:plaintext; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .him { align-self:flex-start; background:var(--him); border-bottom-left-radius:4px; }
  .sys { align-self:center; font-size:12px; color:var(--dim); border:none; background:none; text-align:center; }
  form { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); }
  input[type=text] { flex:1; min-width:0; background:#06121a; color:var(--text); border:1px solid var(--line);
    border-radius:22px; padding:12px 16px; font-size:16px; outline:none; }
  input[type=text]:focus { border-color:var(--pri); }
  button { border:0; border-radius:50%; width:44px; height:44px; flex:none; cursor:pointer;
    background:var(--pri); color:#00131a; font-weight:700; }
  button.mic { background:#0e2a37; color:var(--pri); }
  button.mic.live { background:#c0392b; color:#fff; }
  .opts { display:flex; justify-content:space-between; align-items:center; padding:6px 16px 10px;
    font-size:12px; color:var(--dim); background:var(--panel); }
  .opts label { display:flex; gap:6px; align-items:center; }
  .setup { margin:auto; padding:24px; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<header>
  <span class="brand">JARVIS</span>
  <span class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span></span>
</header>
<div id="log"></div>
<form id="f" autocomplete="off">
  <button type="button" class="mic" id="mic" title="Speak" aria-label="Speak">🎤</button>
  <input type="text" id="t" dir="auto" placeholder="Message JARVIS…" enterkeyhint="send">
  <button type="submit" aria-label="Send">➤</button>
</form>
<div class="opts">
  <label><input type="checkbox" id="speak"> Read replies aloud</label>
  <span>JARVIS must be running on your PC</span>
</div>

<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const log = $('log'), dot = $('dot'), stat = $('stat');
  const CFG = window.JARVIS_CLOUD;
  if (!CFG || !CFG.url || !CFG.key) {
    log.innerHTML = '<div class="setup">config.js is missing — upload the whole <b>phone</b> folder, including config.js.</div>';
    return;
  }
  const H = { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' };
  const REST = CFG.url.replace(/\/$/, '') + '/rest/v1/';
  const api = (path, opt) => fetch(REST + path, Object.assign({ headers: H }, opt || {}));

  function add(kind, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + kind; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }

  let lastOut = 0, pending = 0, waitTimer = null;

  async function history() {
    try {
      const [i, o] = await Promise.all([
        api('phone_inbox?select=id,message,created_at&order=created_at.desc&limit=25').then(r => r.json()),
        api('phone_outbox?select=id,message,created_at&order=created_at.desc&limit=25').then(r => r.json())
      ]);
      const all = [].concat(i.map(r => Object.assign(r, { k: 'me' })), o.map(r => Object.assign(r, { k: 'him' })))
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      log.innerHTML = '';
      all.forEach(m => add(m.k, m.message));
      lastOut = Math.max(0, ...o.map(r => r.id));
      setOnline(true);
      if (!all.length) add('sys', 'Say something — JARVIS answers on your PC and here.');
    } catch (e) { setOnline(false); }
  }

  function setOnline(ok) {
    dot.className = 'dot ' + (ok ? 'on' : 'off');
    stat.textContent = ok ? 'cloud connected' : 'no connection';
  }

  async function poll() {
    try {
      const r = await api('phone_outbox?select=id,message&id=gt.' + lastOut + '&order=id.asc');
      const rows = await r.json();
      setOnline(true);
      if (Array.isArray(rows)) for (const row of rows) {
        lastOut = row.id; pending = 0; clearTimeout(waitTimer);
        document.querySelectorAll('.msg.sys.wait').forEach(n => n.remove());
        add('him', row.message);
        if ($('speak').checked) say(row.message);
      }
    } catch (e) { setOnline(false); }
  }
  setInterval(poll, 3000);

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('t').value.trim(); if (!text) return;
    $('t').value = ''; add('me', text);
    try {
      const r = await api('phone_inbox', { method: 'POST', body: JSON.stringify({ message: text, processed: false }) });
      if (!r.ok) throw new Error(r.status);
      pending++; clearTimeout(waitTimer);
      waitTimer = setTimeout(() => {
        if (pending) { const n = add('sys', "Waiting for JARVIS… (is it running on your PC?)"); n.classList.add('wait'); }
      }, 20000);
    } catch (err) { add('sys', 'Could not send — check your connection.'); }
  });

  /* Speech in/out: plain browser APIs, silently absent where unsupported. */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR(); rec.interimResults = false; rec.continuous = false;
    rec.onresult = ev => { $('t').value = ev.results[0][0].transcript; $('mic').classList.remove('live'); $('f').requestSubmit(); };
    rec.onend = rec.onerror = () => $('mic').classList.remove('live');
    $('mic').onclick = () => { try { rec.lang = navigator.language || 'en-US'; rec.start(); $('mic').classList.add('live'); } catch (_) {} };
  } else { $('mic').style.display = 'none'; }
  function say(t) { try { const u = new SpeechSynthesisUtterance(t); speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (_) {} }

  history();
})();
</script>
</body>
</html>
